<body>

<div class="container">
    <h2>猜数字</h2>

    <div class="card" style="border-bottom: 4px solid var(--player);">
        <div class="section-title"><span class="dot" style="background:var(--player)"></span> 你的回合</div>
        <input type="text" id="user-input" placeholder="请在这里输入4位数字猜测" maxlength="4">
        <button class="btn-p" id="btn-p" py-click="player_action">提交猜测</button>
        <div class="res-box" id="player-res">等待你出手...</div>
    </div>

    <div class="card" style="border-bottom: 4px solid var(--comp);">
        <div class="section-title"><span class="dot" style="background:var(--comp)"></span> 电脑的猜测</div>
        <div class="res-box" id="comp-guess-val">等待轮到电脑...</div>
        
        <div id="feedback-area" style="display:none; margin-top:15px; padding-top:15px; border-top: 1px solid #eee;">
            <input type="number" id="feedback-num" placeholder="它对了几位？(反馈给电脑 0-4)" min="0" max="4">
            <button class="btn-c" py-click="comp_feedback_action">确认反馈，进入下一轮</button>
        </div>
    </div>

    <div class="card">
        <div id="log"></div>
        <button style="background:#95a5a6; color:white; margin-top:15px;" py-click="reset_game">🔄 重新开局</button>
    </div>
</div>

<script type="py">
import random
import asyncio
from itertools import permutations
from pyscript import document

state = {"mynum": "", "candidates": [], "cur_guess": "", "over": False}

def add_log(msg):
    log = document.querySelector("#log")
    log.innerHTML = f"<div>> {msg}</div>" + log.innerHTML

def reset_game(e=None):
    state["mynum"] = "".join(map(str, random.sample(range(10), 4)))
    state["candidates"] = [''.join(p) for p in permutations('0123456789', 4)]
    state["over"] = False
    state["cur_guess"] = ""
    
    document.querySelector("#log").innerHTML = ""
    document.querySelector("#player-res").innerText = "等待你出手..."
    document.querySelector("#comp-guess-val").innerText = "等待轮到电脑..."
    document.querySelector("#feedback-area").style.display = "none"
    document.querySelector("#btn-p").disabled = False
    document.querySelector("#user-input").value = ""
    add_log("游戏已重置。")

async def player_action(e):
    if state["over"]: return
    val = document.querySelector("#user-input").value.strip()
    if len(val) != 4 or not val.isdigit():
        document.querySelector("#player-res").innerText = "请输入4个数字"
        return
    
    # 1. 处理玩家结果
    res = sum(1 for i in range(4) if val[i] == state["mynum"][i])
    document.querySelector("#player-res").innerHTML = f"你猜 {val}：<b>对了 {res} 位</b>"
    add_log(f"你猜 {val} -> 对了 {res}")
    
    if res == 4:
        add_log("你赢了！")
        state["over"] = True
        document.querySelector("#btn-p").disabled = True
        return

    # 2. 自动切换到电脑回合
    document.querySelector("#btn-p").disabled = True
    document.querySelector("#comp-guess-val").innerText = "电脑正在思考..."
    

    
    if not state["candidates"]:
        document.querySelector("#comp-guess-val").innerText = "线索矛盾，请重新开始"
        return

    state["cur_guess"] = random.choice(state["candidates"])
    document.querySelector("#comp-guess-val").innerHTML = f"电脑猜测：<b>{state['cur_guess']}</b>"
    document.querySelector("#feedback-area").style.display = "block"

def comp_feedback_action(e):
    fb_val = document.querySelector("#feedback-num").value
    if fb_val == "": return
    
    fb = int(fb_val)
    add_log(f"电脑猜 {state['cur_guess']} -> 反馈 {fb}")
    
    if fb == 4:
        add_log("电脑先猜到了！")
        state["over"] = True
        document.querySelector("#feedback-area").style.display = "none"
    else:
        state["candidates"] = [c for c in state["candidates"] if sum(1 for i in range(4) if state['cur_guess'][i] == c[i]) == fb]
        
        document.querySelector("#feedback-area").style.display = "none"
        document.querySelector("#btn-p").disabled = False
        document.querySelector("#user-input").value = ""
        document.querySelector("#player-res").innerText = "轮到你猜了..."
        document.querySelector("#comp-guess-val").innerText = "等待你提交..."
        document.querySelector("#feedback-num").value = ""

reset_game()
</script>
